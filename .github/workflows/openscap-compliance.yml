name: OpenSCAP Container Compliance Scan

on:
  push:
    branches: [ main, dev, qa ]
  pull_request:
    branches: [ main, dev, qa ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  openscap-container-scan:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.2.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

    - name: Build container image
      uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
      with:
        context: .
        push: false
        tags: grc-toolkit:scan
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Record image size
      id: image_size
      run: |
        SIZE=$(docker images grc-toolkit:scan --format "{{.Size}}")
        echo "size=$SIZE" >> $GITHUB_OUTPUT
        echo "=== Container Image Size ===" | tee image-info.txt
        echo "Image: grc-toolkit:scan" | tee -a image-info.txt
        echo "Size: $SIZE" | tee -a image-info.txt
        docker images grc-toolkit:scan

    - name: Install OpenSCAP
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libopenscap25t64 \
          openscap-scanner \
          openscap-utils \
          wget \
          unzip
        oscap --version

    - name: Download pinned upstream ComplianceAsCode SSG for Ubuntu 24.04
      run: |
        # ComplianceAsCode upstream content for Ubuntu 24.04
        # Using latest release that includes Ubuntu 24.04 support
        SSG_VERSION="0.1.73"
        SSG_BASE_URL="https://github.com/ComplianceAsCode/content/releases/download/v${SSG_VERSION}"
        
        echo "Downloading ComplianceAsCode SSG v${SSG_VERSION}..."
        mkdir -p /tmp/ssg-content
        cd /tmp/ssg-content
        
        # Try to download the full package
        wget -q "${SSG_BASE_URL}/scap-security-guide-${SSG_VERSION}.zip" -O ssg.zip 2>/dev/null || \
        wget -q "https://github.com/ComplianceAsCode/content/archive/refs/tags/v${SSG_VERSION}.zip" -O ssg.zip
        
        unzip -q ssg.zip
        
        # Find Ubuntu datastream (try 24.04, fall back to 22.04, then 20.04)
        DATASTREAM=""
        for version in 2404 2204 2004; do
          DATASTREAM=$(find . -name "*ubuntu${version}*ds*.xml" -o -name "*ubuntu${version}*.xml" | grep -v "oval" | head -1)
          if [ -n "$DATASTREAM" ]; then
            echo "Found Ubuntu datastream: $DATASTREAM"
            break
          fi
        done
        
        if [ -z "$DATASTREAM" ] || [ ! -f "$DATASTREAM" ]; then
          echo "WARNING: No Ubuntu datastream found in upstream SSG v${SSG_VERSION}"
          echo "Available XML files:"
          find . -name "*.xml" | head -20
          
          # Try using the repo's packaged SSG as fallback
          sudo apt-get install -y ssg-debian
          
          if [ -f /usr/share/xml/scap/ssg/content/ssg-ubuntu2404-ds.xml ]; then
            DATASTREAM="/usr/share/xml/scap/ssg/content/ssg-ubuntu2404-ds.xml"
          elif [ -f /usr/share/xml/scap/ssg/content/ssg-ubuntu2204-ds.xml ]; then
            DATASTREAM="/usr/share/xml/scap/ssg/content/ssg-ubuntu2204-ds.xml"
          else
            # Use Debian as last resort (Ubuntu is Debian-based)
            DATASTREAM="/usr/share/xml/scap/ssg/content/ssg-debian12-ds.xml"
          fi
        fi
        
        echo "DATASTREAM=$DATASTREAM" >> $GITHUB_ENV
        cp "$DATASTREAM" /tmp/ssg-datastream.xml
        
        echo "=== Selected Datastream ==="
        echo "File: $DATASTREAM"
        ls -lh /tmp/ssg-datastream.xml
        
        echo "=== Available Profiles ==="
        oscap info /tmp/ssg-datastream.xml | grep -A 1 "Profiles:"

    - name: Extract and mount container filesystem
      run: |
        # Create a temporary container to extract the filesystem
        CONTAINER_ID=$(docker create grc-toolkit:scan)
        mkdir -p /tmp/container-fs
        docker export $CONTAINER_ID | tar -C /tmp/container-fs -xf -
        docker rm $CONTAINER_ID
        
        echo "Container filesystem extracted to /tmp/container-fs"
        ls -la /tmp/container-fs | head -20

    - name: Create XCCDF tailoring file for container exclusions
      run: |
        # Create tailoring file to exclude host-only rules that don't apply to containers
        cat > /tmp/container-tailoring.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<xccdf-1.2:Tailoring xmlns:xccdf-1.2="http://checklists.nist.gov/xccdf/1.2" id="xccdf_container_tailoring_default">
  <xccdf-1.2:benchmark href="/tmp/ssg-datastream.xml"/>
  <xccdf-1.2:version time="$(date -u +%Y-%m-%dT%H:%M:%S)">1</xccdf-1.2:version>
  <xccdf-1.2:Profile id="xccdf_container_profile_container_hardening" extends="xccdf_org.ssgproject.content_profile_standard">
    <xccdf-1.2:title>Container Hardening Profile (Standard with Container Exclusions)</xccdf-1.2:title>
    <xccdf-1.2:description>Standard profile with rules not applicable to containers excluded</xccdf-1.2:description>
    
    <!-- Exclude rules that require kernel parameters (containers share host kernel) -->
    <xccdf-1.2:select idref="xccdf_org.ssgproject.content_rule_sysctl_*" selected="false"/>
    
    <!-- Exclude rules about grub/bootloader (containers don't boot) -->
    <xccdf-1.2:select idref="xccdf_org.ssgproject.content_rule_grub*" selected="false"/>
    
    <!-- Exclude rules about kernel modules (containers share host kernel) -->
    <xccdf-1.2:select idref="xccdf_org.ssgproject.content_rule_kernel_module_*" selected="false"/>
    
    <!-- Exclude rules about partitioning (containers don't have separate partitions) -->
    <xccdf-1.2:select idref="xccdf_org.ssgproject.content_rule_partition_*" selected="false"/>
    <xccdf-1.2:select idref="xccdf_org.ssgproject.content_rule_mount_option_*" selected="false"/>
    
    <!-- Exclude rules about physical console access -->
    <xccdf-1.2:select idref="xccdf_org.ssgproject.content_rule_disable_ctrlaltdel*" selected="false"/>
    
    <!-- Exclude systemd-specific rules if not using systemd in container -->
    <!-- Keep these for now as we might have systemd -->
  </xccdf-1.2:Profile>
</xccdf-1.2:Tailoring>
EOF
        
        echo "Created tailoring file: /tmp/container-tailoring.xml"

    - name: Run OpenSCAP scan on container filesystem
      id: scan
      continue-on-error: true
      run: |
        mkdir -p openscap-reports
        
        # Determine profile to use
        PROFILE_ID="xccdf_org.ssgproject.content_profile_standard"
        
        # Check if CIS Level 1 Server profile exists
        if oscap info /tmp/ssg-datastream.xml | grep -q "cis_level1_server"; then
          PROFILE_ID="xccdf_org.ssgproject.content_profile_cis_level1_server"
          PROFILE_DESC="CIS Level 1 Server"
        elif oscap info /tmp/ssg-datastream.xml | grep -q "cis_server"; then
          PROFILE_ID="xccdf_org.ssgproject.content_profile_cis_server"
          PROFILE_DESC="CIS Server"
        elif oscap info /tmp/ssg-datastream.xml | grep -q "stig"; then
          PROFILE_ID="xccdf_org.ssgproject.content_profile_stig"
          PROFILE_DESC="DISA STIG"
        else
          PROFILE_DESC="Standard System Security"
        fi
        
        echo "Using profile: $PROFILE_ID ($PROFILE_DESC)"
        echo "profile_desc=$PROFILE_DESC" >> $GITHUB_OUTPUT
        
        # Run scan with the container filesystem as root
        # Note: Some checks may fail/error because we're scanning a static filesystem
        oscap xccdf eval \
          --profile "$PROFILE_ID" \
          --results openscap-reports/results.xml \
          --report openscap-reports/report.html \
          --cpe /tmp/ssg-datastream.xml \
          /tmp/ssg-datastream.xml || SCAN_EXIT=$?
        
        # OpenSCAP exit codes:
        # 0 = all rules passed
        # 1 = error occurred  
        # 2 = some rules failed
        echo "scan_exit_code=${SCAN_EXIT:-0}" >> $GITHUB_OUTPUT
        
        if [ "${SCAN_EXIT:-0}" -eq 1 ]; then
          echo "ERROR: OpenSCAP scan encountered an error"
          # Don't exit yet - we'll check if any rules were evaluated
        elif [ "${SCAN_EXIT:-0}" -eq 2 ]; then
          echo "OpenSCAP scan completed with rule failures (exit code 2)"
        else
          echo "OpenSCAP scan completed successfully (exit code 0)"
        fi

    - name: Parse and report scan results
      if: always()
      run: |
        if [ ! -f openscap-reports/results.xml ]; then
          echo "ERROR: Results file not generated - scan failed to run"
          exit 1
        fi
        
        # Parse results
        TOTAL_RULES=$(xmllint --xpath 'count(//rule-result)' openscap-reports/results.xml 2>/dev/null || echo "0")
        PASS_RULES=$(xmllint --xpath 'count(//rule-result[result="pass"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        FAIL_RULES=$(xmllint --xpath 'count(//rule-result[result="fail"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        ERROR_RULES=$(xmllint --xpath 'count(//rule-result[result="error"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        NOTAPPLICABLE_RULES=$(xmllint --xpath 'count(//rule-result[result="notapplicable"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        NOTCHECKED_RULES=$(xmllint --xpath 'count(//rule-result[result="notchecked"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        
        # Count by severity
        HIGH_FAIL=$(xmllint --xpath 'count(//rule-result[result="fail" and @severity="high"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        MEDIUM_FAIL=$(xmllint --xpath 'count(//rule-result[result="fail" and @severity="medium"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        LOW_FAIL=$(xmllint --xpath 'count(//rule-result[result="fail" and @severity="low"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        UNKNOWN_FAIL=$(xmllint --xpath 'count(//rule-result[result="fail" and @severity="unknown"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        
        echo "=== OpenSCAP Container Compliance Scan Results ===" | tee openscap-reports/summary.txt
        echo "" | tee -a openscap-reports/summary.txt
        echo "Scan Target: grc-toolkit:scan container image" | tee -a openscap-reports/summary.txt
        echo "Profile: ${{ steps.scan.outputs.profile_desc }}" | tee -a openscap-reports/summary.txt
        echo "Image Size: ${{ steps.image_size.outputs.size }}" | tee -a openscap-reports/summary.txt
        echo "" | tee -a openscap-reports/summary.txt
        echo "Total Rules: $TOTAL_RULES" | tee -a openscap-reports/summary.txt
        echo "  Passed: $PASS_RULES" | tee -a openscap-reports/summary.txt
        echo "  Failed: $FAIL_RULES (High: $HIGH_FAIL, Medium: $MEDIUM_FAIL, Low: $LOW_FAIL, Unknown: $UNKNOWN_FAIL)" | tee -a openscap-reports/summary.txt
        echo "  Errors: $ERROR_RULES" | tee -a openscap-reports/summary.txt
        echo "  Not Applicable: $NOTAPPLICABLE_RULES" | tee -a openscap-reports/summary.txt
        echo "  Not Checked: $NOTCHECKED_RULES" | tee -a openscap-reports/summary.txt
        echo "" | tee -a openscap-reports/summary.txt
        
        # Calculate compliance percentage (excluding not applicable and not checked)
        EVALUATED=$((PASS_RULES + FAIL_RULES + ERROR_RULES))
        if [ "$EVALUATED" -gt 0 ]; then
          COMPLIANCE_PCT=$(echo "scale=2; ($PASS_RULES * 100) / $EVALUATED" | bc)
          echo "Compliance Score: ${COMPLIANCE_PCT}% (of $EVALUATED evaluated rules)" | tee -a openscap-reports/summary.txt
        fi
        
        echo "" | tee -a openscap-reports/summary.txt
        echo "Artifacts:" | tee -a openscap-reports/summary.txt
        echo "  - openscap-reports/report.html (human-readable)" | tee -a openscap-reports/summary.txt
        echo "  - openscap-reports/results.xml (XCCDF ARF)" | tee -a openscap-reports/summary.txt
        
        # Fail if no rules were evaluated
        if [ "$TOTAL_RULES" -eq 0 ]; then
          echo "" | tee -a openscap-reports/summary.txt
          echo "ERROR: No rules were evaluated. This indicates a problem with the scan." | tee -a openscap-reports/summary.txt
          cat openscap-reports/summary.txt
          exit 1
        fi
        
        cat openscap-reports/summary.txt

    - name: Check high-severity failures
      if: always() && hashFiles('openscap-reports/results.xml') != ''
      run: |
        HIGH_FAIL=$(xmllint --xpath 'count(//rule-result[result="fail" and @severity="high"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        
        if [ "$HIGH_FAIL" -gt 0 ]; then
          echo "⚠️  Found $HIGH_FAIL high-severity compliance failures"
          echo ""
          echo "High-severity failures found in container image scan."
          echo "Review the report to determine if these are fixable in the image."
          echo ""
          echo "Common container limitations:"
          echo "  - Kernel parameters (sysctl) cannot be set in containers"
          echo "  - Bootloader (grub) settings don't apply"
          echo "  - Partition/mount options are controlled by the host"
          echo ""
          echo "If failures are container-limitation related, document them and keep report-only."
          echo "If failures are fixable (packages, file permissions, configs), fix them."
          
          # For now, make this report-only until we've reviewed the failures
          # TODO: Change to "exit 1" once we've fixed what's fixable and documented what's not
          echo ""
          echo "Current mode: REPORT-ONLY (not blocking merge)"
        else
          echo "✅ No high-severity compliance failures"
        fi

    - name: Upload OpenSCAP reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v5.0.1
      with:
        name: openscap-container-reports
        path: |
          openscap-reports/report.html
          openscap-reports/results.xml
          openscap-reports/summary.txt
          image-info.txt
        retention-days: 90
