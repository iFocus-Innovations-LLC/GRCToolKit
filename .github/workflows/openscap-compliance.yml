name: OpenSCAP Compliance Scan

on:
  push:
    branches: [ main, dev, qa ]
  pull_request:
    branches: [ main, dev, qa ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  openscap-scan:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.2.2

    - name: Install OpenSCAP and SCAP Security Guide
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenscap25t64 openscap-scanner openscap-utils ssg-debian ssg-nondebian
        oscap --version

    - name: List available SSG profiles
      run: |
        echo "=== Available SCAP Security Guide Datastreams ==="
        ls -lh /usr/share/xml/scap/ssg/content/ | grep "debian\|ubuntu" || ls -lh /usr/share/xml/scap/ssg/content/ | head -20
        echo ""
        echo "=== Checking for Ubuntu/Debian profiles ==="
        for ds in ssg-ubuntu2404-ds.xml ssg-ubuntu2204-ds.xml ssg-debian12-ds.xml ssg-debian11-ds.xml; do
          if [ -f /usr/share/xml/scap/ssg/content/$ds ]; then
            echo "Found: $ds"
            oscap info /usr/share/xml/scap/ssg/content/$ds | grep -A 2 "Profiles:" | head -20
            break
          fi
        done

    - name: Run OpenSCAP compliance scan (report-only, runner baseline)
      id: scan
      run: |
        # Determine which SSG datastream to use
        # Note: Ubuntu 24.04 SSG packages don't include Ubuntu-specific content
        # Fall back to Debian profiles (Ubuntu is Debian-based)
        # Debian profiles use different naming - "standard" instead of "cis_level1_server"
        if [ -f /usr/share/xml/scap/ssg/content/ssg-ubuntu2404-ds.xml ]; then
          DATASTREAM="/usr/share/xml/scap/ssg/content/ssg-ubuntu2404-ds.xml"
          PROFILE_ID="xccdf_org.ssgproject.content_profile_cis_level1_server"
          PROFILE_DESC="Ubuntu 24.04 CIS Level 1 Server"
        elif [ -f /usr/share/xml/scap/ssg/content/ssg-ubuntu2204-ds.xml ]; then
          DATASTREAM="/usr/share/xml/scap/ssg/content/ssg-ubuntu2204-ds.xml"
          PROFILE_ID="xccdf_org.ssgproject.content_profile_cis_level1_server"
          PROFILE_DESC="Ubuntu 22.04 CIS Level 1 Server"
        elif [ -f /usr/share/xml/scap/ssg/content/ssg-debian12-ds.xml ]; then
          DATASTREAM="/usr/share/xml/scap/ssg/content/ssg-debian12-ds.xml"
          # Debian uses "standard" profile which aligns with CIS and NIST 800-53
          PROFILE_ID="xccdf_org.ssgproject.content_profile_standard"
          PROFILE_DESC="Debian 12 Standard System Security Profile (Ubuntu 24.04 is Debian-based)"
        elif [ -f /usr/share/xml/scap/ssg/content/ssg-debian11-ds.xml ]; then
          DATASTREAM="/usr/share/xml/scap/ssg/content/ssg-debian11-ds.xml"
          PROFILE_ID="xccdf_org.ssgproject.content_profile_standard"
          PROFILE_DESC="Debian 11 Standard System Security Profile (fallback for Debian-based Ubuntu)"
        else
          echo "ERROR: No Ubuntu or Debian SSG datastream found"
          echo "Available datastreams:"
          ls -1 /usr/share/xml/scap/ssg/content/*.xml | head -10
          exit 1
        fi
        
        echo "Using datastream: $DATASTREAM"
        echo "Using profile: $PROFILE_DESC"
        echo "Profile ID: $PROFILE_ID"
        echo ""
        echo "ℹ️  REPORT-ONLY MODE: This scans the GitHub-hosted runner baseline."
        echo "   Compliance failures are reported but do not block merges."
        echo "   The runner is ephemeral and controlled by GitHub, not this project."
        echo ""
        
        # Create output directory
        mkdir -p openscap-reports
        
        # Run the scan - this scans the CI runner (Ubuntu 24.04) for compliance baseline
        # Note: We use --fetch-remote-resources to download any missing OVAL definitions
        # The scan may fail (exit code 2) if there are compliance failures - this is expected
        sudo oscap xccdf eval \
          --profile "$PROFILE_ID" \
          --fetch-remote-resources \
          --results openscap-reports/results.xml \
          --report openscap-reports/report.html \
          "$DATASTREAM" || SCAN_EXIT=$?
        
        # OpenSCAP exit codes:
        # 0 = scan completed, all rules passed
        # 1 = error occurred (fail the job - this is a real error)
        # 2 = scan completed, some rules failed (report only, don't fail)
        echo "scan_exit_code=${SCAN_EXIT:-0}" >> $GITHUB_OUTPUT
        echo "profile_desc=$PROFILE_DESC" >> $GITHUB_OUTPUT
        
        if [ "${SCAN_EXIT:-0}" -eq 1 ]; then
          echo "❌ ERROR: OpenSCAP scan encountered an error"
          exit 1
        elif [ "${SCAN_EXIT:-0}" -eq 2 ]; then
          echo "⚠️  OpenSCAP scan completed with compliance rule failures (exit code 2)"
          echo "   This is report-only and does not block the build."
        else
          echo "✅ OpenSCAP scan completed successfully (exit code 0)"
        fi

    - name: Generate compliance summary and report high-severity findings
      if: always() && hashFiles('openscap-reports/results.xml') != ''
      run: |
        # Get profile description from scan step
        PROFILE_DESC="${{ steps.scan.outputs.profile_desc || 'CIS Level 1 Server' }}"
        
        echo "=== OpenSCAP Compliance Summary (CI Runner Baseline) ===" | tee openscap-reports/summary.txt
        echo "" | tee -a openscap-reports/summary.txt
        echo "Target: GitHub Actions runner (Ubuntu 24.04)" | tee -a openscap-reports/summary.txt
        echo "Profile: $PROFILE_DESC" | tee -a openscap-reports/summary.txt
        echo "Mode: Report-only (does not block merges)" | tee -a openscap-reports/summary.txt
        echo "" | tee -a openscap-reports/summary.txt
        
        # Extract score and results using oscap xccdf generate
        oscap xccdf generate report openscap-reports/results.xml > openscap-reports/detailed-report.html || true
        
        # Parse results for summary
        TOTAL_RULES=$(xmllint --xpath 'count(//rule-result)' openscap-reports/results.xml 2>/dev/null || echo "0")
        PASS_RULES=$(xmllint --xpath 'count(//rule-result[result="pass"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        FAIL_RULES=$(xmllint --xpath 'count(//rule-result[result="fail"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        ERROR_RULES=$(xmllint --xpath 'count(//rule-result[result="error"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        NOTAPPLICABLE_RULES=$(xmllint --xpath 'count(//rule-result[result="notapplicable"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        
        # Count high-severity failures for reporting
        HIGH_SEVERITY_FAIL=$(xmllint --xpath 'count(//rule-result[result="fail" and @severity="high"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        MEDIUM_SEVERITY_FAIL=$(xmllint --xpath 'count(//rule-result[result="fail" and @severity="medium"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        LOW_SEVERITY_FAIL=$(xmllint --xpath 'count(//rule-result[result="fail" and @severity="low"])' openscap-reports/results.xml 2>/dev/null || echo "0")
        
        echo "Total Rules Evaluated: $TOTAL_RULES" | tee -a openscap-reports/summary.txt
        echo "Passed: $PASS_RULES" | tee -a openscap-reports/summary.txt
        echo "Failed: $FAIL_RULES (High: $HIGH_SEVERITY_FAIL, Medium: $MEDIUM_SEVERITY_FAIL, Low: $LOW_SEVERITY_FAIL)" | tee -a openscap-reports/summary.txt
        echo "Errors: $ERROR_RULES" | tee -a openscap-reports/summary.txt
        echo "Not Applicable: $NOTAPPLICABLE_RULES" | tee -a openscap-reports/summary.txt
        echo "" | tee -a openscap-reports/summary.txt
        
        # Calculate compliance percentage
        if [ "$TOTAL_RULES" -gt 0 ]; then
          COMPLIANCE_PCT=$(echo "scale=2; ($PASS_RULES * 100) / $TOTAL_RULES" | bc)
          echo "Compliance Score: ${COMPLIANCE_PCT}%" | tee -a openscap-reports/summary.txt
        fi
        
        echo "" | tee -a openscap-reports/summary.txt
        echo "Full report: openscap-reports/report.html" | tee -a openscap-reports/summary.txt
        echo "Results (ARF): openscap-reports/results.xml" | tee -a openscap-reports/summary.txt
        echo "" | tee -a openscap-reports/summary.txt
        
        # Report high-severity findings
        if [ "$HIGH_SEVERITY_FAIL" -gt 0 ]; then
          echo "⚠️  Found $HIGH_SEVERITY_FAIL high-severity compliance failures on CI runner baseline" | tee -a openscap-reports/summary.txt
          echo "   This is report-only and does not block merges." | tee -a openscap-reports/summary.txt
          echo "   The runner is ephemeral and controlled by GitHub, not this project." | tee -a openscap-reports/summary.txt
          echo "" | tee -a openscap-reports/summary.txt
          echo "   To review findings, download the openscap-compliance-reports artifact" | tee -a openscap-reports/summary.txt
          echo "   and open report.html" | tee -a openscap-reports/summary.txt
        else
          echo "✅ No high-severity compliance failures detected" | tee -a openscap-reports/summary.txt
        fi
        
        # Show the summary
        cat openscap-reports/summary.txt

    - name: Upload OpenSCAP reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v5.0.1
      with:
        name: openscap-compliance-reports
        path: |
          openscap-reports/report.html
          openscap-reports/results.xml
          openscap-reports/summary.txt
        retention-days: 90

    - name: Upload XCCDF results as SARIF (if converter available)
      if: always() && hashFiles('openscap-reports/results.xml') != ''
      continue-on-error: true
      run: |
        # Check if xccdf-to-sarif converter is available
        # Note: There is no official XCCDF-to-SARIF converter maintained by NIST or GitHub
        # Several community tools exist but none are production-ready for automated CI
        # For now, we skip SARIF upload and rely on the HTML/XML reports
        echo "ℹ️  XCCDF-to-SARIF conversion skipped"
        echo "   No reliable, maintained XCCDF-to-SARIF converter is available."
        echo "   Review compliance results in the HTML report artifact instead."
        echo ""
        echo "   If a converter becomes available, we can add SARIF upload here."
        echo "   See: https://github.com/openscap/openscap/issues (feature requests)"

  container-scap-analysis:
    runs-on: ubuntu-24.04
    steps:
    - name: Investigate container SCAP scanning options
      run: |
        echo "=== Container-Level OpenSCAP Scanning Investigation ==="
        echo ""
        echo "ℹ️  Current state:"
        echo "   • CI runner baseline: Ubuntu 24.04 scanned with SSG CIS L1 Server (report-only)"
        echo "   • Container base: nginx:1.31.8-alpine-slim (pinned by SHA256)"
        echo "   • Container vulnerabilities: Covered by Trivy/Docker Scout (gates on HIGH/CRITICAL)"
        echo ""
        echo "⚠️  Alpine Linux SCAP limitation:"
        echo "   Alpine uses musl libc and apk (not glibc/apt/yum), which are not covered by"
        echo "   standard SCAP Security Guide (SSG) content. Meaningful SCAP scanning requires"
        echo "   a base image with SSG profile support."
        echo ""
        echo "🔍 Recommended follow-up investigation:"
        echo ""
        echo "   Option 1: Ubuntu minimal base (ubuntu:24.04-minimal or ubuntu:noble)"
        echo "   ├─ Pros: SSG profiles available, apt ecosystem, broader community support"
        echo "   ├─ Cons: Larger image (~30-50MB vs Alpine's ~8MB), systemd considerations"
        echo "   ├─ nginx: Available via apt (nginx-light for minimal footprint)"
        echo "   └─ SCAP: Full CIS/DISA-STIG profiles via ssg-debian package"
        echo ""
        echo "   Option 2: Red Hat UBI (ubi9-minimal or ubi9-micro)"
        echo "   ├─ Pros: Enterprise-grade, excellent SSG support (DISA-STIG, OSPP, CIS)"
        echo "   ├─ Cons: RHEL ecosystem (yum/dnf), slightly larger than Alpine"
        echo "   ├─ nginx: Available via dnf or AppStream"
        echo "   ├─ SCAP: Comprehensive via scap-security-guide package"
        echo "   └─ FIPS: Optional FIPS 140-3 mode for federal compliance (if needed later)"
        echo ""
        echo "   Option 3: Debian slim (debian:12-slim)"
        echo "   ├─ Pros: Middle ground on size (~25-40MB), broad SSG support"
        echo "   ├─ Cons: Less minimal than Alpine, needs SSG backports for latest profiles"
        echo "   ├─ nginx: Native nginx package available"
        echo "   └─ SCAP: CIS profiles via ssg-debian"
        echo ""
        echo "   Option 4: Keep Alpine + custom OVAL"
        echo "   ├─ Pros: Smallest image, existing Trivy/Scout coverage sufficient"
        echo "   ├─ Cons: No comprehensive SSG profiles, manual OVAL maintenance burden"
        echo "   └─ Recommendation: Only if image size is critical and existing vuln scans suffice"
        echo ""
        echo "📊 Trade-off summary:"
        echo "   • Image size: Alpine < UBI micro < Ubuntu minimal < Debian slim < UBI minimal"
        echo "   • SCAP coverage: UBI ≈ Ubuntu > Debian >> Alpine"
        echo "   • Existing vuln scans: Trivy/Scout cover all bases well (HIGH/CRITICAL gate)"
        echo "   • Federal/FedRAMP: UBI has FIPS option; Ubuntu/Debian need hardening guides"
        echo ""
        echo "💡 Recommended path:"
        echo "   1. Evaluate if current Trivy/Scout gates provide sufficient security validation"
        echo "   2. If SCAP evidence is required for compliance: test Ubuntu 24.04 minimal or UBI9-micro"
        echo "   3. Compare image size impact: docker images <image> --format '{{.Size}}'"
        echo "   4. Run oscap-docker/oscap-podman on test images to confirm profile compatibility"
        echo "   5. Document the decision in PR description or docs/SECURITY-GATE.md"
        echo ""
        echo "   Example test command (Ubuntu base):"
        echo "   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \\"
        echo "     openscapcontent/openscap-base:latest \\"
        echo "     oscap-docker image ubuntu:24.04 xccdf eval \\"
        echo "       --profile xccdf_org.ssgproject.content_profile_cis_level1_server \\"
        echo "       /usr/share/xml/scap/ssg/content/ssg-ubuntu2404-ds.xml"
        echo ""
        echo "📋 Current recommendation: Accept CI runner baseline as sufficient unless"
        echo "   customer/auditor requires container-level SCAP evidence. Trivy HIGH/CRITICAL"
        echo "   gate already provides strong vulnerability coverage for the shipped artifact."
