name: Puppet Audit Engine CI

on:
  pull_request:
    paths:
      - 'puppet/**'
      - 'scripts/puppet-*'
      - 'scripts/test-puppet-audit.sh'
      - '.github/workflows/puppet-ci.yml'

jobs:
  puppet-tests:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Puppet 8
      run: |
        curl -O https://apt.puppet.com/puppet-release-jammy.deb
        sudo dpkg -i puppet-release-jammy.deb
        sudo apt-get update
        sudo apt-get install -y puppet-agent
        echo "/opt/puppetlabs/bin" >> $GITHUB_PATH

    - name: Verify Puppet installation
      run: puppet --version

    - name: Create test fixtures directory
      run: mkdir -p /tmp/puppet-fixtures

    - name: Create compliant sshd_config fixture
      run: |
        cat > /tmp/puppet-fixtures/sshd_config_compliant <<'EOF'
        # NIST 800-53 compliant SSH configuration
        Port 22
        Protocol 2
        PasswordAuthentication no
        PermitRootLogin no
        PubkeyAuthentication yes
        UsePAM yes
        ChallengeResponseAuthentication no
        EOF

    - name: Create non-compliant sshd_config fixture
      run: |
        cat > /tmp/puppet-fixtures/sshd_config_noncompliant <<'EOF'
        # Non-compliant SSH configuration (drift)
        Port 22
        Protocol 2
        PasswordAuthentication yes
        PermitRootLogin yes
        PubkeyAuthentication no
        UsePAM yes
        ChallengeResponseAuthentication no
        EOF

    - name: Test compliant config (expect PASS)
      run: |
        echo "Testing compliant configuration..."
        puppet apply --noop --detailed-exitcodes \
          --modulepath=./puppet/modules \
          -e "class { 'grc_audit::ssh_hardening': sshd_config_path => '/tmp/puppet-fixtures/sshd_config_compliant' }" \
          2>&1 | tee /tmp/puppet-compliant-output.txt || EXIT_CODE=$?
        
        echo "Exit code: ${EXIT_CODE:-0}"
        
        # Exit code 0 = no changes needed (PASS)
        if [ "${EXIT_CODE:-0}" -eq 0 ]; then
          echo "✅ PASS: Compliant config detected correctly"
        else
          echo "❌ FAIL: Expected exit code 0 (PASS), got ${EXIT_CODE:-0}"
          cat /tmp/puppet-compliant-output.txt
          exit 1
        fi

    - name: Test non-compliant config (expect WARN/drift)
      run: |
        echo "Testing non-compliant configuration..."
        puppet apply --noop --detailed-exitcodes \
          --modulepath=./puppet/modules \
          -e "class { 'grc_audit::ssh_hardening': sshd_config_path => '/tmp/puppet-fixtures/sshd_config_noncompliant' }" \
          2>&1 | tee /tmp/puppet-noncompliant-output.txt || EXIT_CODE=$?
        
        echo "Exit code: ${EXIT_CODE:-0}"
        
        # Exit code 2 = changes would be made (WARN/drift)
        if [ "${EXIT_CODE:-0}" -eq 2 ]; then
          echo "✅ WARN: Drift detected correctly"
        else
          echo "❌ FAIL: Expected exit code 2 (WARN), got ${EXIT_CODE:-0}"
          cat /tmp/puppet-noncompliant-output.txt
          exit 1
        fi

    - name: Test wrapper with compliant config
      run: |
        echo "Testing wrapper with compliant configuration..."
        ./scripts/puppet-audit-wrapper.sh \
          grc_audit::ssh_hardening \
          IA-2 \
          /tmp/puppet-fixtures/sshd_config_compliant \
          > /tmp/wrapper-compliant.json 2>&1 || true
        
        cat /tmp/wrapper-compliant.json
        
        # Verify JSON structure
        if command -v jq &>/dev/null; then
          STATUS=$(jq -r '.status' /tmp/wrapper-compliant.json)
          if [ "$STATUS" = "PASS" ]; then
            echo "✅ Wrapper correctly reported PASS for compliant config"
          else
            echo "❌ FAIL: Expected status PASS, got $STATUS"
            exit 1
          fi
        fi

    - name: Test wrapper with non-compliant config
      run: |
        echo "Testing wrapper with non-compliant configuration..."
        ./scripts/puppet-audit-wrapper.sh \
          grc_audit::ssh_hardening \
          IA-2 \
          /tmp/puppet-fixtures/sshd_config_noncompliant \
          > /tmp/wrapper-noncompliant.json 2>&1 || true
        
        cat /tmp/wrapper-noncompliant.json
        
        # Verify JSON structure
        if command -v jq &>/dev/null; then
          STATUS=$(jq -r '.status' /tmp/wrapper-noncompliant.json)
          if [ "$STATUS" = "WARN" ]; then
            echo "✅ Wrapper correctly reported WARN for non-compliant config"
          else
            echo "❌ FAIL: Expected status WARN, got $STATUS"
            exit 1
          fi
        fi

    - name: Test OSCAL export with compliant config
      run: |
        echo "Testing OSCAL export..."
        ./scripts/puppet-audit-wrapper.sh \
          grc_audit::ssh_hardening \
          IA-2 \
          /tmp/puppet-fixtures/sshd_config_compliant \
          --oscal \
          > /tmp/wrapper-oscal.json 2>&1 || true
        
        # Find and validate OSCAL file
        OSCAL_FILE=$(find /tmp/grc-oscal-reports -name "puppet-*.json" -type f 2>/dev/null | head -1)
        if [ -n "$OSCAL_FILE" ] && [ -f "$OSCAL_FILE" ]; then
          echo "✅ OSCAL file created: $OSCAL_FILE"
          
          if command -v jq &>/dev/null; then
            if jq -e '.["assessment-results"]' "$OSCAL_FILE" >/dev/null 2>&1; then
              echo "✅ OSCAL structure valid"
              jq '.["assessment-results"].results[0].findings[0]' "$OSCAL_FILE"
            else
              echo "❌ FAIL: Invalid OSCAL structure"
              cat "$OSCAL_FILE"
              exit 1
            fi
          fi
        else
          echo "❌ FAIL: OSCAL file not created"
          exit 1
        fi

    - name: Run full smoke test
      run: ./scripts/test-puppet-audit.sh
