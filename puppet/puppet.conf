# Minimal puppet.conf for agentless puppet apply
# Used by GRCToolKit Puppet audit engine (noop mode only)

[main]
# Base directory for module path
basemodulepath = /workspace/puppet/modules

# Environment
environment = production

# Reports directory (noop output)
reportdir = /workspace/puppet/reports

# No master/agent
# This config is for puppet apply --noop only
