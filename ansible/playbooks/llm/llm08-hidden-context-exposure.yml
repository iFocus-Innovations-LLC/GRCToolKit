---
# OWASP GenAI LLM Top 10 2026 — LLM08:2026 Hidden Context Exposure (read-only)
# https://genai.owasp.org/llm-top-10/
# HITL: no auto-remediation. Part of GRCToolKit Shields Up.
#
# Usage:
#   cd ansible/playbooks/llm
#   ansible-playbook -i inventory.yml llm08-hidden-context-exposure.yml

- name: "OWASP LLM08:2026 — Hidden Context Exposure — read-only validation"
  hosts: all
  gather_facts: yes
  vars_files:
    - vars/defaults.yml
  vars:
    llm_findings: []
    llm_report_basename: "llm08-hidden-context-exposure"
  tasks:
    - name: "Include common setup"
      include_tasks: tasks/setup.yml
      tags: always

    - name: "Include LLM08:2026 probes"
      include_tasks:
        file: tasks/llm08-hidden-context-exposure.yml
        apply:
          tags: [LLM08, hidden_context]
      tags: [LLM08, hidden_context]

    - name: "Include report"
      include_tasks: tasks/report.yml
      tags: always
