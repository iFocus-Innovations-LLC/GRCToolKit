---
# OWASP GenAI LLM Top 10 2026 — LLM02:2026 Sensitive Information Disclosure (read-only)
# https://genai.owasp.org/llm-top-10/
# HITL: no auto-remediation. Part of GRCToolKit Shields Up.
#
# Usage:
#   cd ansible/playbooks/llm
#   ansible-playbook -i inventory.yml llm02-sensitive-information-disclosure.yml

- name: "OWASP LLM02:2026 — Sensitive Information Disclosure — read-only validation"
  hosts: all
  gather_facts: yes
  vars_files:
    - vars/defaults.yml
  vars:
    llm_findings: []
    llm_report_basename: "llm02-sensitive-information-disclosure"
  tasks:
    - name: "Include common setup"
      include_tasks: tasks/setup.yml
      tags: always

    - name: "Include LLM02:2026 probes"
      include_tasks:
        file: tasks/llm02-sensitive-information-disclosure.yml
        apply:
          tags: [LLM02, sensitive_disclosure]
      tags: [LLM02, sensitive_disclosure]

    - name: "Include report"
      include_tasks: tasks/report.yml
      tags: always
