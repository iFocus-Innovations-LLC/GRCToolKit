---
# OWASP GenAI LLM Top 10 2026 — LLM03:2026 Excessive Agency (read-only)
# https://genai.owasp.org/llm-top-10/
# HITL: no auto-remediation. Part of GRCToolKit Shields Up.
#
# Usage:
#   cd ansible/playbooks/llm
#   ansible-playbook -i inventory.yml llm03-excessive-agency.yml

- name: "OWASP LLM03:2026 — Excessive Agency — read-only validation"
  hosts: all
  gather_facts: yes
  vars_files:
    - vars/defaults.yml
  vars:
    llm_findings: []
    llm_report_basename: "llm03-excessive-agency"
  tasks:
    - name: "Include common setup"
      include_tasks: tasks/setup.yml
      tags: always

    - name: "Include LLM03:2026 probes"
      include_tasks:
        file: tasks/llm03-excessive-agency.yml
        apply:
          tags: [LLM03, excessive_agency]
      tags: [LLM03, excessive_agency]

    - name: "Include report"
      include_tasks: tasks/report.yml
      tags: always
