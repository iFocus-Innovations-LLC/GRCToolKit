---
# OWASP GenAI LLM Top 10 2026 — LLM04:2026 Supply Chain (read-only)
# https://genai.owasp.org/llm-top-10/
# HITL: no auto-remediation. Part of GRCToolKit Shields Up.
#
# Usage:
#   cd ansible/playbooks/llm
#   ansible-playbook -i inventory.yml llm04-supply-chain.yml

- name: "OWASP LLM04:2026 — Supply Chain — read-only validation"
  hosts: all
  gather_facts: yes
  vars_files:
    - vars/defaults.yml
  vars:
    llm_findings: []
    llm_report_basename: "llm04-supply-chain"
  tasks:
    - name: "Include common setup"
      include_tasks: tasks/setup.yml
      tags: always

    - name: "Include LLM04:2026 probes"
      include_tasks:
        file: tasks/llm04-supply-chain.yml
        apply:
          tags: [LLM04, supply_chain]
      tags: [LLM04, supply_chain]

    - name: "Include report"
      include_tasks: tasks/report.yml
      tags: always
