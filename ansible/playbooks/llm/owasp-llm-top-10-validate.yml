---
# OWASP GenAI LLM Top 10 2026 — suite orchestrator (read-only)
# https://genai.owasp.org/llm-top-10/
#
# Part of GRCToolKit Shields Up / LLM security assessment (HITL: no auto-remediation).
# Per-risk stems live alongside this file (llm01-… through llm10-…); probes are shared
# via tasks/ so there is one source of truth.
#
# Usage:
#   cd ansible/playbooks/llm
#   ansible-playbook -i inventory.yml owasp-llm-top-10-validate.yml
#
# Run a single category:
#   ansible-playbook -i inventory.yml owasp-llm-top-10-validate.yml --tags LLM06

- name: "OWASP GenAI LLM Top 10 2026 — read-only validation"
  hosts: all
  gather_facts: yes
  vars_files:
    - vars/defaults.yml
  vars:
    llm_findings: []
    llm_report_basename: "owasp-llm-top-10"
  tasks:
    - name: "Include common setup"
      include_tasks: tasks/setup.yml
      tags: always

    - name: "Include LLM01:2026 Prompt Injection"
      include_tasks:
        file: tasks/llm01-prompt-injection.yml
        apply:
          tags: [LLM01, prompt_injection]
      tags: [LLM01, prompt_injection]

    - name: "Include LLM02:2026 Sensitive Information Disclosure"
      include_tasks:
        file: tasks/llm02-sensitive-information-disclosure.yml
        apply:
          tags: [LLM02, sensitive_disclosure]
      tags: [LLM02, sensitive_disclosure]

    - name: "Include LLM03:2026 Excessive Agency"
      include_tasks:
        file: tasks/llm03-excessive-agency.yml
        apply:
          tags: [LLM03, excessive_agency]
      tags: [LLM03, excessive_agency]

    - name: "Include LLM04:2026 Supply Chain"
      include_tasks:
        file: tasks/llm04-supply-chain.yml
        apply:
          tags: [LLM04, supply_chain]
      tags: [LLM04, supply_chain]

    - name: "Include LLM05:2026 Data and Model Poisoning"
      include_tasks:
        file: tasks/llm05-data-model-poisoning.yml
        apply:
          tags: [LLM05, data_model_poisoning]
      tags: [LLM05, data_model_poisoning]

    - name: "Include LLM06:2026 Unbounded Consumption"
      include_tasks:
        file: tasks/llm06-unbounded-consumption.yml
        apply:
          tags: [LLM06, unbounded_consumption]
      tags: [LLM06, unbounded_consumption]

    - name: "Include LLM07:2026 Misinformation"
      include_tasks:
        file: tasks/llm07-misinformation.yml
        apply:
          tags: [LLM07, misinformation]
      tags: [LLM07, misinformation]

    - name: "Include LLM08:2026 Hidden Context Exposure"
      include_tasks:
        file: tasks/llm08-hidden-context-exposure.yml
        apply:
          tags: [LLM08, hidden_context]
      tags: [LLM08, hidden_context]

    - name: "Include LLM09:2026 Vector and Embedding Weaknesses"
      include_tasks:
        file: tasks/llm09-vector-embedding-weaknesses.yml
        apply:
          tags: [LLM09, vector_embedding]
      tags: [LLM09, vector_embedding]

    - name: "Include LLM10:2026 Improper Output Handling"
      include_tasks:
        file: tasks/llm10-improper-output-handling.yml
        apply:
          tags: [LLM10, output_handling]
      tags: [LLM10, output_handling]

    - name: "Include report"
      include_tasks: tasks/report.yml
      tags: always
