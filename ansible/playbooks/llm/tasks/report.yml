---
# Emit JSON evidence for OWASP LLM Top 10 2026 (validation only — no remediation).
- name: "Generate OWASP LLM Top 10 2026 compliance report"
  copy:
    content: "{{ report_payload | to_nice_json }}"
    dest: "{{ llm_report_dir }}/{{ llm_report_basename | default('owasp-llm-top-10') }}-{{ inventory_hostname }}-{{ ansible_date_time.epoch }}.json"
    mode: "0644"
  vars:
    fail_count: "{{ llm_findings | selectattr('status', 'equalto', 'FAIL') | list | length }}"
    warn_count: "{{ llm_findings | selectattr('status', 'equalto', 'WARN') | list | length }}"
    report_payload:
      framework: "{{ owasp_framework }}"
      reference: "{{ owasp_reference }}"
      grc_audit_mode: "{{ grc_audit_mode | default('read_only') }}"
      hostname: "{{ inventory_hostname }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      target_url: "{{ llm_app_base_url }}{{ llm_app_path }}"
      overall_status: "{{ 'FAIL' if (fail_count | int) > 0 else ('WARN' if (warn_count | int) > 0 else 'PASS') }}"
      summary:
        pass: "{{ llm_findings | selectattr('status', 'equalto', 'PASS') | list | length }}"
        warn: "{{ warn_count }}"
        fail: "{{ fail_count }}"
        skip: "{{ llm_findings | selectattr('status', 'equalto', 'SKIP') | list | length }}"
      findings: "{{ llm_findings }}"
  tags: always

- name: "Display OWASP LLM Top 10 2026 summary"
  debug:
    msg:
      - "OWASP GenAI LLM Top 10 2026 validation complete (read-only)"
      - "Target: {{ llm_app_base_url }}{{ llm_app_path }}"
      - "Report: {{ llm_report_dir }}/{{ llm_report_basename | default('owasp-llm-top-10') }}-{{ inventory_hostname }}-*.json"
      - "{{ llm_findings }}"
  tags: always
