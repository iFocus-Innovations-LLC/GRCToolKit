---
# OWASP GenAI LLM Top 10 2026 — LLM01:2026 Prompt Injection (read-only)
# https://genai.owasp.org/llm-top-10/
# HITL: no auto-remediation. Part of GRCToolKit Shields Up.
#
# Usage:
#   cd ansible/playbooks/llm
#   ansible-playbook -i inventory.yml llm01-prompt-injection.yml

- name: "OWASP LLM01:2026 — Prompt Injection — read-only validation"
  hosts: all
  gather_facts: yes
  vars_files:
    - vars/defaults.yml
  vars:
    llm_findings: []
    llm_report_basename: "llm01-prompt-injection"
  tasks:
    - name: "Include common setup"
      include_tasks: tasks/setup.yml
      tags: always

    - name: "Include LLM01:2026 probes"
      include_tasks:
        file: tasks/llm01-prompt-injection.yml
        apply:
          tags: [LLM01, prompt_injection]
      tags: [LLM01, prompt_injection]

    - name: "Include report"
      include_tasks: tasks/report.yml
      tags: always
