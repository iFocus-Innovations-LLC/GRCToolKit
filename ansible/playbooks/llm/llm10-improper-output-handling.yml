---
# OWASP GenAI LLM Top 10 2026 — LLM10:2026 Improper Output Handling (read-only)
# https://genai.owasp.org/llm-top-10/
# HITL: no auto-remediation. Part of GRCToolKit Shields Up.
#
# Usage:
#   cd ansible/playbooks/llm
#   ansible-playbook -i inventory.yml llm10-improper-output-handling.yml

- name: "OWASP LLM10:2026 — Improper Output Handling — read-only validation"
  hosts: all
  gather_facts: yes
  vars_files:
    - vars/defaults.yml
  vars:
    llm_findings: []
    llm_report_basename: "llm10-improper-output-handling"
  tasks:
    - name: "Include common setup"
      include_tasks: tasks/setup.yml
      tags: always

    - name: "Include LLM10:2026 probes"
      include_tasks:
        file: tasks/llm10-improper-output-handling.yml
        apply:
          tags: [LLM10, output_handling]
      tags: [LLM10, output_handling]

    - name: "Include report"
      include_tasks: tasks/report.yml
      tags: always
