---
# OWASP GenAI LLM Top 10 2026 — LLM05:2026 Data and Model Poisoning (read-only)
# https://genai.owasp.org/llm-top-10/
# HITL: no auto-remediation. Part of GRCToolKit Shields Up.
#
# Usage:
#   cd ansible/playbooks/llm
#   ansible-playbook -i inventory.yml llm05-data-model-poisoning.yml

- name: "OWASP LLM05:2026 — Data and Model Poisoning — read-only validation"
  hosts: all
  gather_facts: yes
  vars_files:
    - vars/defaults.yml
  vars:
    llm_findings: []
    llm_report_basename: "llm05-data-model-poisoning"
  tasks:
    - name: "Include common setup"
      include_tasks: tasks/setup.yml
      tags: always

    - name: "Include LLM05:2026 probes"
      include_tasks:
        file: tasks/llm05-data-model-poisoning.yml
        apply:
          tags: [LLM05, data_model_poisoning]
      tags: [LLM05, data_model_poisoning]

    - name: "Include report"
      include_tasks: tasks/report.yml
      tags: always
