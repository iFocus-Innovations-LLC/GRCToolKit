---
# Local MVP demo inventory (Mac or Linux laptop — no GCP required)
#
# Production: use a private inventory with SSH + become per docs/ANSIBLE-AUDIT-OPERATIONS.md
# Do NOT trigger remote hosts from the GRCToolKit UI/API in v1.
#
# Usage:
#   cd ansible/playbooks
#   ansible-playbook -i inventory.yml ac-3-access-enforcement.yml
#
# Note: Playbooks load OS path maps via tasks/load_platform_vars.yml
# (Darwin / Debian / Ubuntu / RedHat / Amazon / Alpine + optional K8s overlay).
# On macOS, Linux-only probes are skipped or noted — expected for laptop demos.
# K8s: see inventory.k8s.example.yml (GKE/EKS/AKS-agnostic hostPath /host pattern).

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: auto_silent
